name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:ci

  edge-functions:
    name: Typecheck Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The config lives with the functions, so pass it explicitly rather than
      # relying on discovery from the repository root.
      - name: Type check Deno functions
        shell: bash
        run: |
          shopt -s globstar
          deno check --config supabase/functions/deno.json supabase/functions/**/*.ts

      - name: Test Deno functions
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/
