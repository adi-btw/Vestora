name: Scan alerts

# GitHub Actions is the scheduler because Supabase's own cron extension is not on
# the free plan. Calling the function on a schedule also counts as project
# activity, which stops a free Supabase project from pausing for inactivity.
#
# The job is opt-in: it only runs once the repository variable ALERTS_ENABLED is
# set to "true". Until the backend is deployed the job is skipped rather than
# failed, so an unconfigured repo does not send failure mail every 30 minutes.
on:
  schedule:
    # Every 30 minutes, 08:00-01:00 UTC (covers 4am-8pm US Eastern) on weekdays.
    # 30 rather than 15 keeps a private repo inside the free Actions minutes.
    - cron: '*/30 8-23,0-1 * * 1-5'
    # One weekend ping purely to keep the Supabase project awake.
    - cron: '0 12 * * 6'
  workflow_dispatch:

concurrency:
  group: scan-alerts
  cancel-in-progress: false

jobs:
  scan:
    name: Evaluate alerts
    # `vars` is available in a job-level condition; `secrets` is not, which is why
    # the switch is a variable and the secrets are checked inside the step.
    if: vars.ALERTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Call scan-alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::ALERTS_ENABLED is true but the SUPABASE_URL and CRON_SECRET secrets are missing."
            exit 1
          fi

          response=$(mktemp)
          status=$(curl --silent --show-error \
            --max-time 60 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "x-cron-secret: $CRON_SECRET" \
            --header 'Content-Type: application/json' \
            --request POST \
            "$SUPABASE_URL/functions/v1/scan-alerts") || true

          echo "HTTP $status"
          cat "$response"
          echo

          # A non-2xx means the scanner is broken; failing loudly beats a schedule
          # that has quietly done nothing for weeks.
          case "$status" in
            2*) exit 0 ;;
            *) echo "::error::scan-alerts returned HTTP $status"; exit 1 ;;
          esac
